name: Build Mobile Arm64 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Use installed JDK for Gradle daemon
        run: rm -f gradle/gradle-daemon-jvm.properties

      - name: Build mobile arm64 release APK
        run: ./gradlew :app:assembleMobileArm64_v8aRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-arm64-v8a-release-apk
          path: app/build/outputs/apk/mobile/arm64_v8a/release/*.apk
          if-no-files-found: error
