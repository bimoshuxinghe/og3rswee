name: Build Mobile Arm64 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Use installed JDK for Gradle daemon
        run: rm -f gradle/gradle-daemon-jvm.properties

      - name: Build mobile arm64 release APK
        run: |
          ./gradlew :app:assembleMobileArm64_v8aRelease --no-daemon --no-build-cache --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Collect APK
        if: success()
        run: |
          mkdir -p Release/apk
          find app/build/outputs/apk -name '*.apk' -not -path '*/.gradle/*' -exec cp {} Release/apk/ \;
          find Release/apk -name '*.apk' -maxdepth 1 -type f

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-arm64-v8a-release-apk
          path: |
            app/build/outputs/apk/*/release/*.apk
            Release/apk/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Commit build result
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .github/build-logs
          if [ -f build.log ]; then cp build.log .github/build-logs/latest-mobile-arm64-build.log; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/build-logs/latest-mobile-arm64-build.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No build result files to commit"
          else
            git commit -m "Update mobile arm64 build result [skip ci]"
            git push || echo "::warning::Build log push failed."
          fi
