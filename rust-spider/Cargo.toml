[package]
name = "spider_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "spider_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
# JNI 桥接（文档 3.2 要求）
jni = "0.21"
# 异步运行时（文档 3.2 要求）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# 网络请求（文档 3.2 要求；关闭 default-tls 改用纯 Rust rustls，Android 无 OpenSSL 依赖）
reqwest = { version = "0.12", default-features = false, features = ["gzip", "brotli", "cookies", "json", "rustls-tls"] }
# HTML 解析（文档 3.2 要求）
scraper = "0.19"
# JSON 序列化（文档 3.2 要求）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 工具库（文档 3.2 要求）
regex = "1"
url = "2"
once_cell = "1"
# WASM 执行引擎（播放地址签名生成，纯 Rust 无 C 依赖）
wasmi = "0.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# 不用 panic="abort"：JNI 边界必须能捕获 panic，避免整个 App 崩溃
strip = true
