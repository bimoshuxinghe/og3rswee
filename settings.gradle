pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        gradlePluginPortal()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url = uri("$rootDir/third_party/maven") }
        google()
        mavenCentral()
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        flatDir { dirs "$rootDir/app/libs" }
        maven { url = "https://jitpack.io" }
    }
}

// Include FongMi's custom Media3 fork as a composite build.
// This substitutes all androidx.media3:* Maven coordinates with the local source modules,
// enabling the custom MediaTitle / Danmaku extensions to be compiled in.
def mediaDir = new File(rootDir, 'media')
if (mediaDir.exists()) {
    includeBuild(mediaDir) {
        dependencySubstitution {
            substitute module('androidx.media3:media3-common') using project(':lib-common')
            // substitute module('androidx.media3:media3-common-ktx') using project(':lib-common-ktx')
            substitute module('androidx.media3:media3-container') using project(':lib-container')
            substitute module('androidx.media3:media3-session') using project(':lib-session')
            substitute module('androidx.media3:media3-exoplayer') using project(':lib-exoplayer')
            substitute module('androidx.media3:media3-exoplayer-dash') using project(':lib-exoplayer-dash')
            substitute module('androidx.media3:media3-exoplayer-hls') using project(':lib-exoplayer-hls')
            substitute module('androidx.media3:media3-exoplayer-rtsp') using project(':lib-exoplayer-rtsp')
            substitute module('androidx.media3:media3-exoplayer-smoothstreaming') using project(':lib-exoplayer-smoothstreaming')
            substitute module('androidx.media3:media3-ui') using project(':lib-ui')
            substitute module('androidx.media3:media3-ui-danmaku') using project(':lib-ui-danmaku')
            substitute module('androidx.media3:media3-database') using project(':lib-database')
            substitute module('androidx.media3:media3-datasource') using project(':lib-datasource')
            substitute module('androidx.media3:media3-datasource-okhttp') using project(':lib-datasource-okhttp')
            substitute module('androidx.media3:media3-datasource-rtmp') using project(':lib-datasource-rtmp')
            substitute module('androidx.media3:media3-decoder') using project(':lib-decoder')
            substitute module('androidx.media3:media3-decoder-ffmpeg') using project(':lib-decoder-ffmpeg')
            substitute module('androidx.media3:media3-extractor') using project(':lib-extractor')
            substitute module('androidx.media3:media3-effect') using project(':lib-effect')
        }
    }
}

include ':app'
include ':catvod'
include ':chaquo'
include ':forcetech'
include ':hook'
include ':jianpian'
include ':quickjs'
include ':thunder'
include ':tvbus'
include ':zlive'
rootProject.name = "TV"
