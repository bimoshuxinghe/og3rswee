pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        gradlePluginPortal()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url = uri("$rootDir/third_party/maven") }
        google()
        mavenCentral()
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        flatDir { dirs "$rootDir/app/libs" }
        maven { url = "https://jitpack.io" }
    }
}

// Media3 升级策略（"精确局部 rebase"）：
//   官方 androidx/media 1.11.0 源码作基底（common），
//   FongMi/TV 的自定义扩展（Player/MediaItem 补丁 + ui 层弹幕/渲染补丁）编译在其之上，
//   通过根工程的 dependencySubstitution 顶替官方 media3-common / media3-ui 构件。
include ':media3-common'   // androidx.media3.common.*（官方 1.11.0 + FongMi 补丁）
include ':media3-ui'       // androidx.media3.ui.*（fork ui，含 PlayerView/SubtitleView 补丁）
include ':media3-danmaku'  // androidx.media3.ui.danmaku.*
include ':media3-decoder-ffmpeg' // androidx.media3.decoder.ffmpeg.*（FFmpeg 软解 Java 层，native .so 在 app/jniLibs）

include ':app'
include ':catvod'
include ':chaquo'
include ':forcetech'
include ':hook'
include ':jianpian'
include ':quickjs'
include ':thunder'
include ':tvbus'
include ':zlive'

// m3u8-ad-audio-probe SDK（智能趣广告替代方案）作为本地子模块引入，
// 复用 TV-Mobile 的 AGP / Media3 本地 fork toolchain。
include ':probe:probe-api'
include ':probe:probe-adapter-api'
include ':probe:probe-core'
include ':probe:probe-runtime'
include ':probe:probe-media3-1-9'
include ':probe:probe-collector-tools'
rootProject.name = "TV"
