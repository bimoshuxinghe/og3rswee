pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        gradlePluginPortal()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url = uri("$rootDir/third_party/maven") }
        google()
        mavenCentral()
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        flatDir { dirs "$rootDir/app/libs" }
        maven { url = "https://jitpack.io" }
    }
}

// B 方案：弃用 vendored Media3 fork（/media 复合构建），改用官方 Maven androidx.media3:*:1.11.0。
// FongMi 的自定义扩展（MediaTitle / 弹幕）提取为独立本地模块，编译在官方 1.11.0 之上。
include ':media3-extras'   // androidx.media3.common.MediaTitle
include ':media3-danmaku'  // androidx.media3.ui.danmaku.*

include ':app'
include ':catvod'
include ':chaquo'
include ':forcetech'
include ':hook'
include ':jianpian'
include ':quickjs'
include ':thunder'
include ':tvbus'
include ':zlive'

// m3u8-ad-audio-probe SDK（智能趣广告替代方案）作为本地子模块引入，
// 复用 TV-Mobile 的 AGP / Media3 本地 fork toolchain。
include ':probe:probe-api'
include ':probe:probe-adapter-api'
include ':probe:probe-core'
include ':probe:probe-runtime'
include ':probe:probe-media3-1-9'
include ':probe:probe-collector-tools'
rootProject.name = "TV"
